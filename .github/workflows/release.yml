name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag & release (e.g. 0.1.0)"
        required: false
        default: "0.1.5"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        # JetBrains Runtime，不是 temurin：只有 JBR 會在 XIM 回調之內上報光標矩形
        # （sun.awt.X11.XInputMethod$ClientComponentCaretPositionTracker；OpenJDK 那個類
        # 根本不存在，實測 ClassNotFoundException）→ 少了它 fcitx5 候選窗永遠釘在視窗左下角。
        #
        # 21 → 25（規則 15 吃最新）：抬到 25 之前先在本機把 JBR 25.0.4.1 驗過兩件事——
        # (a) `jimage list lib/modules` 找得到 ClientComponentCaretPositionTracker（OpenJDK 25/27 都找不到）、
        # (b) jmods 目錄有 72 個模組（jlink 才生得出執行期）。兩件都成立才敢換。
        # 上限停在 25 不是沒抬：JetBrainsRuntime 只發 LTS 軌（最新 release tag
        # jbr-release-25.0.4.1b635.70，沒有 26/27），所以 jetbrains 這個 distribution 最高就是 25。
        #
        # 這一條就足夠改變安裝包裡捆的執行期：打包用的 runtime 由「跑 gradle 的那個 JDK 的
        # jmods」jlink 出來（desktopApp 的 nativeDistributions.modules(...) 只決定模組清單），
        # 所以不需要另外下載 JBR、也不需要碰 jpackage 的 runtimeImage。
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "25"
          # ⚠️ 一定要給 token：沒有它，setup-java 是用**匿名**請求去查 JetBrains 的版號目錄，
          # 匿名配額 60 次/小時、而且是整個 runner 網段共用（實測 release #124 就是這樣紅的：
          # `API rate limit exceeded for 20.64.182.20`，12 秒就掛，跟程式碼無關）。
          # 帶 GITHUB_TOKEN 走認證配額（5000 次/小時）就不會再被別人用光。
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show which runtime will be bundled
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/java" -version 2>&1 | head -3
          echo "jmods 數量：$(ls "$JAVA_HOME/jmods" 2>/dev/null | wc -l)"
          # runtime-only 的 JBR 有 0 個 jmods，那樣 jlink 生不出東西、包會退回沒執行期。
          if [ ! -d "$JAVA_HOME/jmods" ] || [ -z "$(ls -A "$JAVA_HOME/jmods" 2>/dev/null)" ]; then
            echo "::error::JAVA_HOME 裡沒有 jmods（$JAVA_HOME）——換成含 jmods 的 JBR 變體，別讓它靜默降级"
            exit 1
          fi

      - name: Decode Keystore
        env:
          HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > androidApp/release.jks

      - name: Build release APK and Linux packages
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease :desktopApp:packageDistributionForCurrentOS :desktopApp:createDistributable --no-daemon
          # 驗產物、不驗配置：DSL 寫了不等於套得上（moregramX 的簽名就是配置在、產物卻沒簽，
          # 還連紅一個月的 CI）。兩條路都要驗，因為 .deb/.rpm 走 jpackage、
          # 而 Arch 包吃的是 createDistributable 的產物，兩者的 runtime 不一定是同一份。
          # ⚠️ 判「是不是 JBR」不能 grep release 檔裡的 "JetBrains"：jlink 產物的 release 檔
          #    只有 JAVA_VERSION 與 MODULES 兩行、**沒有 implementor 那類字串**，
          #    那樣寫在 CI 上必然紅（實測踩過）。改查**目的本身**：
          #    那個上報光標的類有沒有被砍掉。
          check_runtime() { # $1=runtime 目錄, $2=說明
            local R="$1" W="$2"
            if [ ! -d "$R" ]; then echo "::error::$W 找不到 $R"; exit 1; fi
            head -2 "$R/release" | sed 's/^/    /'
            local N
            N="$("$JAVA_HOME/bin/jimage" list "$R/lib/modules" 2>/dev/null \
                 | grep -ci 'ClientComponentCaretPositionTracker' || true)"
            echo "    ClientComponentCaretPositionTracker 命中 $N 筆"
            if [ "${N:-0}" -lt 1 ]; then
              echo "::error::$W 的 runtime 沒有 JBR 的光標上報類（換執行期白做，見 #62）"
              exit 1
            fi
          }
          echo "--- .deb 內捆的執行期 ---"
          DEB="$(find desktopApp/build/compose/binaries/main -name '*.deb' | head -1)"
          test -n "$DEB"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/debchk"
          check_runtime "$(find "$RUNNER_TEMP/debchk" -type d -name runtime | head -1)" ".deb"
          echo "--- createDistributable 內捆的執行期（Arch 包吃這個）---"
          # 注意路徑裡有 lib/：實測是 app/nashira/lib/runtime，漏一層會直接紅（本地踩過）。
          check_runtime desktopApp/build/compose/binaries/main/app/nashira/lib/runtime "distributable"
          echo "確認：兩條路捆的 runtime 都帶 JBR 的光標上報類"
          echo "APK built:"
          ls -la androidApp/build/outputs/apk/release/*.apk
          echo "Packages:"
          ls -la desktopApp/build/compose/binaries/main/ 2>/dev/null || true

      - name: Verify release APK signature
        # 收口：上面 Decode Keystore 帶 if 條件，RELEASE_KEYSTORE 那個 secret 一旦不見
        # 就會靜默跳過、gradle 照跑、CI 照綠，而產物完全沒簽（moregramX 這樣連發了一個月）。
        # 所以驗「產物」不驗「配置」：v1+v2+v3 要齊、憑證 SHA-256 要對得上基準值。
        # --min-sdk-version 21 不可省：包 minSdk≥24 時 apksigner 會跳過 v1 檢查直接回 false。
        run: |
          set -euo pipefail
          APK="$(ls androidApp/build/outputs/apk/release/*.apk | head -1)"
          APKSIGNER="$(find "${ANDROID_HOME:-/opt/android-sdk}" -name apksigner -type f 2>/dev/null | head -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner，無法驗收公開發布包"
            exit 1
          fi
          if ! OUT="$("$APKSIGNER" verify -v --min-sdk-version 21 "$APK" 2>&1)"; then
            printf '%s\n' "$OUT"
            echo "::error::產物簽名校驗失敗（很可能根本沒簽）"
            exit 1
          fi
          printf '%s\n' "$OUT" | grep -E '^Verified using'
          for scheme in v1 v2 v3; do
            if ! printf '%s\n' "$OUT" | grep -q "Verified using ${scheme} scheme.*: true"; then
              echo "::error::產物缺少 ${scheme} 簽名"
              exit 1
            fi
          done
          # keytool 回大寫十六進位，基準值是小寫——不統一大小寫會把好包判成壞包（本地實測踩到）。
          SHA="$(keytool -printcert -jarfile "$APK" | grep -m1 -oE 'SHA256: [0-9A-F:]+' | cut -d' ' -f2 | tr -d ':' | tr 'A-Z' 'a-z')"
          if [ "$SHA" != "67d935baa2ac5c8ee8733f180b38603af6f0ba268dc0bbd5436e5dc4840034cd" ]; then
            echo "::error::簽名憑證與基準值不符（得到 $SHA）——可能退回 runner 隨機 debug 鑰"
            exit 1
          fi
          echo "v1+v2+v3 齊全、憑證對得上基準值"

      - name: Determine release tag
        id: tag
        # dispatch 的 input 走 env 帶進來，不要直接插值進 shell（那樣等於讓
        # input 內容決定命令列）；再驗一次格式，不對就回退到建置配置裡的版號。
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then
            # push（master）或 dispatch：版本取自建置配置；dispatch 帶合法 input 時優先
            if [ -n "$INPUT_VERSION" ] && printf '%s' "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              REF="v$INPUT_VERSION"
            else
              REF="v$(grep -oP '^nashiraVersion=\K.*' gradle.properties)"
            fi
          fi
          echo "TAG=$REF" >> "$GITHUB_ENV"

      - name: Upload distributable artifact (for the Arch package job)
        uses: actions/upload-artifact@v4
        with:
          name: main-dist
          path: desktopApp/build/compose/binaries/main/app/nashira
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(androidApp/build/outputs/apk/release/*.apk)
          mapfile -t DEB < <(find desktopApp/build/compose/binaries/main -name '*.deb' 2>/dev/null)
          mapfile -t RPM < <(find desktopApp/build/compose/binaries/main -name '*.rpm' 2>/dev/null)
          ASSETS+=("${DEB[@]}" "${RPM[@]}")
          echo "Assets: ${ASSETS[*]}"
          # 版號沒 bump 的提交（只改文件／註解）會走到這裡，而 $TAG 的 release 早已被
          # 「建立這個版本的那一輪」發出去了。實測：對已發布的 release 再
          # `gh release upload --clobber` 會被 GitHub 退回
          # `HTTP 422: Published releases must have a valid tag`（run 36709195271），
          # 於是每個不升版號的提交都紅一次。同一個版本的資產沒有「重發」這回事 → 直接跳過。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在（由建立這個版本的那一輪發布），跳過重複上傳。"
            echo "要重發請先 bump gradle.properties 的 nashiraVersion。"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "Nashira $TAG" \
            --notes "自用分發版。Android APK（**正式自訂簽章**，CN=Nashira／OU=Capricornus007，v1+v2+v3；由下方 Verify 步驟把關，未簽名或憑證不符這個 workflow 會紅）+ Linux .deb/.rpm/.pkg.tar.zst（.pkg.tar.zst 由 arch job 稍後補傳）。"

  arch:
    name: Arch package (.pkg.tar.zst)
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Checkout (PKGBUILD)
        uses: actions/checkout@v5

      - name: Download distributable
        uses: actions/download-artifact@v4
        with:
          name: main-dist
          path: dist

      - name: Build package
        run: |
          # 容器裡的 pacman 資料庫是空的——不同步連 depends 都解析不了；
          # makepkg 不帶 -s（builder 無 sudo），依賴由 root 這裡預裝
          pacman -Syu --noconfirm --needed xdg-utils
          VERSION=$(grep -oP '^nashiraVersion=\K.*' gradle.properties)
          echo "version: ${VERSION}"
          # upload-artifact v4 的根目錄＝所有上傳路徑的最小共同祖先——
          # 下載後可能是 dist/nashira/（單一目錄保留自身）也可能是 dist/，兩種都相容
          DIST_DIR="$PWD/dist/nashira"
          [ -d "$DIST_DIR" ] || DIST_DIR="$PWD/dist"
          echo "dist: $DIST_DIR"; ls "$DIST_DIR"
          # makepkg 拒絕以 root 執行
          useradd -m builder
          chown -R builder:builder "$PWD"
          su builder -c "
            cd '$PWD/packaging' && \
            NASHIRA_VERSION='${VERSION}' \
            NASHIRA_DIST='${DIST_DIR}' \
            NASHIRA_ICONS='$PWD/desktopApp/packaging/hicolor/hicolor' \
            makepkg -f --noconfirm
          "
          # 防呆：包裡必須真的有應用本體（曾因 PKGBUILD 編輯失誤上傳過 139KB 空包）。
          # 注意 makepkg 可能附帶産生 -debug 拆分包——只驗主包，且 glob 展開成
          # 多個檔案時 bsdtar 會把後面的檔名當成「要列出的成員」而報錯。
          MAIN_PKG=""
          for p in packaging/*.pkg.tar.zst; do
            [[ "$p" != *-debug-* ]] && MAIN_PKG="$p"
          done
          [ -n "$MAIN_PKG" ] || { echo "::error::找不到主包 .pkg.tar.zst"; exit 1; }
          echo "main package: $MAIN_PKG"
          bsdtar -tf "$MAIN_PKG" | grep -q "^opt/nashira/bin/nashira" \
            || { echo "::error::Arch 包內缺 opt/nashira/bin/nashira（裝載失敗）"; exit 1; }
          ls -la packaging/*.pkg.tar.zst

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error

  attach-arch:
    name: Attach Arch package to release
    needs: arch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for version detection)
        uses: actions/checkout@v5

      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: assets

      - name: Determine release tag
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then
            INPUT="${{ github.event.inputs.version }}"
            if [ -n "$INPUT" ]; then REF="v$INPUT"
            else REF="v$(grep -oP '^nashiraVersion=\K.*' gradle.properties)"
            fi
          fi
          echo "TAG=$REF" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$(dirname "$(find assets -name '*.pkg.tar.zst' | head -1)")"
          # 只有「這一輪就是發布這個版本的那個 commit」才附檔。對已發布的 release 再
          # `upload --clobber` 會吃到 GitHub 的 HTTP 422（見 Publish 步驟的註解），
          # 而版號沒 bump 的提交（只改文件）走到的正是這種情況。
          TARGET=$(gh release view "$TAG" --json targetCommitish -q .targetCommitish 2>/dev/null || echo "")
          if [ -n "$TARGET" ] && [ "$TARGET" != "$GITHUB_SHA" ]; then
            echo "$TAG 是由 $TARGET 發布的、不是本輪 $GITHUB_SHA → 版號沒 bump，跳過附檔。"
            exit 0
          fi
          gh release upload "$TAG" ./*.pkg.tar.zst --clobber
          echo "Arch package attached to $TAG"
