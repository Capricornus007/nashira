name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag & release (e.g. 0.1.0)"
        required: false
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK and Linux packages
        run: |
          ./gradlew :androidApp:assembleRelease :desktopApp:packageDistributionForCurrentOS :desktopApp:createDistributable --no-daemon
          echo "APK built:"
          ls -la androidApp/build/outputs/apk/release/*.apk
          echo "Packages:"
          ls -la desktopApp/build/compose/binaries/main/ 2>/dev/null || true

      - name: Determine release tag
        id: tag
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then REF="v${{ github.event.inputs.version }}"; fi
          echo "TAG=$REF" >> "$GITHUB_ENV"

      - name: Upload distributable artifact (for the Arch package job)
        uses: actions/upload-artifact@v4
        with:
          name: main-dist
          path: desktopApp/build/compose/binaries/main-dist/nashira
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(androidApp/build/outputs/apk/release/*.apk)
          mapfile -t DEB < <(find desktopApp/build/compose/binaries/main -name '*.deb' 2>/dev/null)
          mapfile -t RPM < <(find desktopApp/build/compose/binaries/main -name '*.rpm' 2>/dev/null)
          ASSETS+=("${DEB[@]}" "${RPM[@]}")
          echo "Assets: ${ASSETS[*]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Nashira $TAG" \
              --notes "自用分發版（debug 簽章）。Android APK + Linux .deb/.rpm/.pkg.tar.zst（.pkg.tar.zst 由 arch job 稍後補傳）。"
          fi

  arch:
    name: Arch package (.pkg.tar.zst)
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Checkout (PKGBUILD)
        uses: actions/checkout@v5

      - name: Download distributable
        uses: actions/download-artifact@v4
        with:
          name: main-dist
          path: dist

      - name: Build package
        run: |
          VERSION=$(grep -oP 'packageVersion\s*=\s*"\K[^"]+' desktopApp/build.gradle.kts)
          echo "version: ${VERSION}"
          # upload-artifact v4 的根目錄＝所有上傳路徑的最小共同祖先——
          # 下載後可能是 dist/nashira/（單一目錄保留自身）也可能是 dist/，兩種都相容
          DIST_DIR="$PWD/dist/nashira"
          [ -d "$DIST_DIR" ] || DIST_DIR="$PWD/dist"
          echo "dist: $DIST_DIR"; ls "$DIST_DIR"
          # makepkg 拒絕以 root 執行
          useradd -m builder
          chown -R builder:builder "$PWD"
          su builder -c "
            cd '$PWD/packaging' && \
            NASHIRA_VERSION='${VERSION}' \
            NASHIRA_DIST='${DIST_DIR}' \
            NASHIRA_ICON='$PWD/desktopApp/packaging/nashira-512.png' \
            makepkg -f --noconfirm
          "
          ls -la packaging/*.pkg.tar.zst

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error

  attach-arch:
    name: Attach Arch package to release
    needs: arch
    runs-on: ubuntu-latest
    steps:
      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: assets

      - name: Determine release tag
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then REF="v${{ github.event.inputs.version }}"; fi
          echo "TAG=$REF" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$(dirname "$(find assets -name '*.pkg.tar.zst' | head -1)")"
          gh release upload "$TAG" ./*.pkg.tar.zst --clobber
          echo "Arch package attached to $TAG"
