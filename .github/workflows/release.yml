name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag & release (e.g. 0.1.0)"
        required: false
        default: "0.1.0"

permissions:
  contents: write

# Arch 用戶端不從這裡拿包：Capricornus007/repo 的 nashira-bin 消費本倉庫
# release 的 .deb（element-desktop-nightly-bin 同款），進 junlin03-aur
# pacman 倉庫（含 repo.db 同步）。
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK and Linux packages
        run: |
          ./gradlew :androidApp:assembleRelease :desktopApp:packageDistributionForCurrentOS --no-daemon
          echo "APK built:"
          ls -la androidApp/build/outputs/apk/release/*.apk
          echo "Packages:"
          ls -la desktopApp/build/compose/binaries/main/ 2>/dev/null || true

      - name: Determine release tag
        id: tag
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then REF="v${{ github.event.inputs.version }}"; fi
          echo "TAG=$REF" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(androidApp/build/outputs/apk/release/*.apk)
          mapfile -t DEB < <(find desktopApp/build/compose/binaries/main -name '*.deb' 2>/dev/null)
          mapfile -t RPM < <(find desktopApp/build/compose/binaries/main -name '*.rpm' 2>/dev/null)
          ASSETS+=("${DEB[@]}" "${RPM[@]}")
          echo "Assets: ${ASSETS[*]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Nashira $TAG" \
              --notes "自用分發版（debug 簽章）。Android APK + Linux .deb/.rpm。Arch 用戶請用 [junlin03-aur](https://github.com/Capricornus007/repo) 的 nashira-bin。"
          fi
