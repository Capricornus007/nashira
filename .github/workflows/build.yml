name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          # 同上：匿名查版號目錄會被共用網段的配額拖垮（release #124 的教訓）
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check translations coverage
        # 放在 Build 之前：這是純文字檢查、幾毫秒，而建置要幾分鐘。
        # 存在的理由：`object JaStrings : Strings by EnStrings` 這種委派會**無聲退回**——
        # 少翻一條編譯照過、界面看起來沒問題，實測過日文缺 7 條、簡中缺 37 條而沒人發現。
        run: python3 tools/check-l10n.py

      - name: Build
        run: ./gradlew :androidApp:assembleDebug :desktopApp:packageDistributionForCurrentOS --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nashira-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: nashira-linux
          path: |
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
