name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download pinned JetBrains Runtime SDK
        # Same checksum-verified SDK used by release.yml; also supplies jmods for package tasks.
        run: tools/setup-jbr.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check translations coverage
        # 放在 Build 之前：這是純文字檢查、幾毫秒，而建置要幾分鐘。
        # 存在的理由：`object JaStrings : Strings by EnStrings` 這種委派會**無聲退回**——
        # 少翻一條編譯照過、界面看起來沒問題，實測過日文缺 7 條、簡中缺 37 條而沒人發現。
        run: python3 tools/check-l10n.py

      - name: Build
        run: ./gradlew :androidApp:assembleDebug :desktopApp:packageDistributionForCurrentOS --no-daemon

      - name: Verify packaged JBR runtime
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(grep -m1 '^jbrVersion=' gradle.properties | cut -d= -f2-)"
          DEB="$(find desktopApp/build/compose/binaries/main -name '*.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/build-deb-check"
          RUNTIME="$(find "$RUNNER_TEMP/build-deb-check" -type d -name runtime -print -quit)"
          test -n "$RUNTIME"
          grep -qx "JAVA_VERSION=\"$EXPECTED_VERSION\"" "$RUNTIME/release"
          TRACKER_COUNT="$("$JAVA_HOME/bin/jimage" list "$RUNTIME/lib/modules" \
            | grep -c 'ClientComponentCaretPositionTracker' || true)"
          test "${TRACKER_COUNT:-0}" -ge 1
          CFG="$(find "$RUNNER_TEMP/build-deb-check" -name nashira.cfg -print -quit)"
          grep -q '^java-options=-Djb.awt.newXimClient.enabled=true$' "$CFG"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: nashira-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: nashira-linux
          path: |
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
