name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :androidApp:assembleDebug :desktopApp:packageDistributionForCurrentOS --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nashira-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: nashira-linux
          path: |
            desktopApp/build/compose/binaries/main-dist/**/*.deb
            desktopApp/build/compose/binaries/main-dist/**/*.rpm
