[versions]
agp = "9.3.2"
kotlin = "2.4.10"
cmp = "1.12.0"
cmpMaterial3 = "1.12.0-alpha03"
materialKolor = "5.0.1"
ktor = "3.3.2"
trixnity = "5.8.1"
activityCompose = "1.13.0"
kotlinxDatetime = "0.8.0"

[libraries]
trixnity-client = { module = "de.connect2x.trixnity:trixnity-client", version.ref = "trixnity" }
cmp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "cmpMaterial3" }
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }
trixnity-repo-room = { module = "de.connect2x.trixnity:trixnity-client-repository-room", version.ref = "trixnity" }
trixnity-media-okio = { module = "de.connect2x.trixnity:trixnity-client-media-okio", version.ref = "trixnity" }
trixnity-cryptodriver-vodozemac = { module = "de.connect2x.trixnity:trixnity-client-cryptodriver-vodozemac", version.ref = "trixnity" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "cmp" }
