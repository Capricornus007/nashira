org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# 版號唯一來源。androidApp 的 versionName、desktopApp 的 packageVersion、
# 以及「設定→關於」顯示的版號全部讀這裡；release.yml 打 tag 也 grep 這一行。
# 以前版號散在三個檔案＋一個寫死的 AppInfo.version，結果 v0.1.10 的套件
# 關於頁還顯示 0.1.0（用戶 2026-09-25 實測點名）。升版只改這一行。
nashiraVersion=0.1.129

# Desktop toolchain/runtime pin. This is the newest official JetBrains Runtime release line as of
# 2026-11-03; GitHub has no jbr-release-26/27 tags. Use JBRSDK (not the runtime archive) because
# Compose's jlink task requires jmods. Both workflows read these exact values instead of resolving
# a moving `java-version: 25` alias; downstream source packages should consume the same pin.
jbrVersion=25.0.4.1
jbrBuild=635.79
jbrTag=jbr-release-25.0.4.1b635.79
# Release metadata: https://github.com/JetBrains/JetBrainsRuntime/releases/tag/jbr-release-25.0.4.1b635.79
jbrLinuxX64Url=https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-25.0.4.1-linux-x64-b635.79.tar.gz
jbrLinuxX64Sha512=1ad3ba2aef8bb417cb3c15e51fda53a7f7fd3a53db44e55902e926541cbf170c53b241832136ad4ca78e4098cd328f7c59ffeb59ac86e230816fd4f9a0a5b097
